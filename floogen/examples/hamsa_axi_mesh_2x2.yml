# Copyright 2026
# Minimal 2x2 AXI mesh profile for HAMSA bring-up.

name: hamsa_axi_mesh_2x2
description: "HAMSA-oriented AXI mesh (2x2, 32-bit)"
network_type: "axi"

routing:
  route_algo: "XY"
  use_id_table: true

protocols:
  - name: "axi_in"
    protocol: "AXI4"
    data_width: 32
    addr_width: 32
    id_width: 10
    user_width: 1
    type_prefix:
  - name: "axi_out"
    protocol: "AXI4"
    data_width: 32
    addr_width: 32
    id_width: 10
    user_width: 1
    type_prefix:

endpoints:
  - name: "cluster"
    array: [2, 2]
    addr_range:
      base: 0x0000_0000
      size: 0x0001_0000
    mgr_port_protocol:
      - "axi_in"
    sbr_port_protocol:
      - "axi_out"
  - name: "mem"
    array: [2]
    addr_range:
      base: 0x8000_0000
      size: 0x0001_0000
    sbr_port_protocol:
      - "axi_out"

routers:
  - name: "router"
    array: [2, 2]
    degree: 5

connections:
  - src: "cluster"
    dst: "router"
    src_range:
      - [0, 1]
      - [0, 1]
    dst_range:
      - [0, 1]
      - [0, 1]
    dst_dir: "Eject"
  - src: "mem"
    dst: "router"
    src_range:
      - [0, 1]
    dst_range:
      - [0, 0]
      - [0, 1]
    dst_dir: "West"
